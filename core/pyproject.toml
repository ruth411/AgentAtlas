[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayiru-core"
version = "0.1.0"
description = "Shared schemas, claim store, and query engine for Ayiru. Used by the ayiru server and the ayiru-mcp stdio server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Ayiru contributors" }]
keywords = ["ai", "agents", "mcp", "knowledge-graph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.8,<3.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/ruth411/ayiru"
Repository = "https://github.com/ruth411/ayiru"

# `app` is a PEP 420 namespace package shared with the `ayiru` backend wheel,
# so we list each regular sub-package explicitly. `app.contracts` and
# `app.services` are themselves namespace packages (no __init__.py) — both
# wheels contribute, `importlib.resources.files("app.contracts")` merges
# them via MultiplexedPath at runtime.
[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = true

[tool.setuptools.package-data]
"app.contracts" = ["*.json"]
