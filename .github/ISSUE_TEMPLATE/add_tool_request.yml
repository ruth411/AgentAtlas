name: Add a tool to Ayiru
description: Request curated coverage for a new tool (helm, aws-cli, redis-cli, etc.).
title: "[add-tool] "
labels: ["add-tool", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Adding a tool to Ayiru is a **contract change**, not a code change.
        It bumps `contracts/ayiru_stage_0.v1.json` (or its successor) and
        every claim for that tool runs through the full orchestrator +
        risk-engine pipeline.

        This is intentional. Curated coverage is what makes a verdict
        trustworthy. Open-ended scope-creep on tools is what makes a
        knowledge layer mush.

        Fill the form below so a maintainer can make a fast yes/no call.
        Vague requests get closed with a link to this paragraph.

  - type: input
    id: tool_id
    attributes:
      label: Tool id (lowercase, hyphenated)
      placeholder: "helm"
    validations:
      required: true

  - type: input
    id: official_homepage
    attributes:
      label: Official homepage URL
      placeholder: "https://helm.sh"
    validations:
      required: true

  - type: input
    id: official_docs
    attributes:
      label: Official documentation host
      description: |
        The canonical docs URL Ayiru's ingestion lanes will fetch from.
        Must be HTTPS. Must be a host the tool's vendor controls (no
        wikis, no Stack Overflow, no aggregators).
      placeholder: "https://helm.sh/docs"
    validations:
      required: true

  - type: dropdown
    id: license
    attributes:
      label: Documentation license
      description: |
        We will not ingest docs whose license forbids redistribution.
        If you're unsure, find the LICENSE file in the docs repo or
        the "Terms" footer on the docs site.
      options:
        - "CC BY 4.0 or CC BY-SA 4.0"
        - "Apache 2.0"
        - "MIT"
        - "BSD"
        - "Public domain"
        - "Proprietary (vendor permission required)"
        - "Unknown — needs research"
    validations:
      required: true

  - type: textarea
    id: destructive_actions
    attributes:
      label: Destructive actions this tool supports
      description: |
        List the commands / API endpoints that change state in ways that
        are hard to reverse. Examples: `helm uninstall`, `aws s3 rm`,
        `redis-cli flushall`. This is what AgentAtlas's risk engine
        will classify.
      placeholder: |
        - helm uninstall <release>
        - helm rollback <release>
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why add this tool?
      description: |
        Concrete agent / workflow that needs it. "We use it" is enough;
        "an agent could theoretically use it" is not.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: The license above is correct; I checked before filing.
          required: true
        - label: I understand this will be considered for a future contract version, not merged immediately.
          required: true
