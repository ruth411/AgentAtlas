name: Rebuild ayiru-mcp bundled catalog

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            backend/pyproject.toml
            mcp/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./core
          pip install -e ./mcp
          pip install -e 'backend[dev]'

      - name: Rebuild bundled structured catalog and run smoke
        run: |
          python tools/scripts/rebuild_structured_product.py \
            --skip-coverage \
            --skip-freshness

      - name: Detect change
        id: diff
        run: |
          if git diff --quiet -- mcp/ayiru_mcp/data/catalog.db; then
            echo "No bundled catalog drift."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Bump ayiru-mcp patch version
        if: steps.diff.outputs.changed == 'true'
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("mcp/pyproject.toml")
          text = path.read_text()
          match = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find version in mcp/pyproject.toml")
          major, minor, patch = map(int, match.groups())
          new = f'version = "{major}.{minor}.{patch + 1}"'
          path.write_text(
              re.sub(
                  r'^version\s*=\s*"\d+\.\d+\.\d+"',
                  new,
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          )
          print(f"Bumped to {major}.{minor}.{patch + 1}")
          PY

      - name: Compose PR body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "Manual rebuild of the bundled structured ayiru-mcp catalog."
            echo
            echo "- Source DB: \`backend/ayiru_v0.2_bulk.db\`"
            echo "- Output bundle: \`mcp/ayiru_mcp/data/catalog.db\`"
            echo "- Validation: \`tools/scripts/rebuild_structured_product.py --skip-coverage --skip-freshness\`"
          } > pr_body.md

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: rebuild-catalog-${{ github.run_id }}
          title: "mcp: rebuild bundled structured catalog"
          commit-message: "mcp: rebuild bundled structured catalog"
          body-path: pr_body.md
          add-paths: |
            mcp/ayiru_mcp/data/catalog.db
            mcp/pyproject.toml
