[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentatlas"
version = "0.1.0"
description = "A verified, machine-readable knowledge layer for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AgentAtlas contributors" }]
keywords = ["ai", "agents", "mcp", "tool-intelligence", "agent-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "graphql-core>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.20,<5.0",
  "openapi-spec-validator>=0.7,<1.0",
  "pydantic>=2.8,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
# After `pip install agentatlas`, the binary `agentatlas` lands on PATH
# and dispatches to `app.cli:main`. The package name stayed `app` to
# avoid a repo-wide rename for v1; we treat it as an internal detail.
agentatlas = "app.cli:main"

[project.urls]
Homepage = "https://github.com/ruth411/AgentAtlas"
Repository = "https://github.com/ruth411/AgentAtlas"
Issues = "https://github.com/ruth411/AgentAtlas/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Stage 14: bundle the versioned trust contracts, the seed artifacts,
# and the alembic migration scripts into the wheel so a plain
# `pip install agentatlas` produces a fully-functional package.
# `contract_paths.contract_path()`, the seed loader, and the alembic
# config resolver all prefer the source-tree copies during development
# and fall back to these bundled paths when the source tree is absent.
"app.contracts" = ["*.json"]
"app.seed_data" = ["**/*.json", "main.py"]
"app._alembic" = ["*.py", "**/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
