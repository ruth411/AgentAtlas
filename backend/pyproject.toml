[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayiru"
version = "0.2.0"
description = "A verified, machine-readable knowledge layer for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Ayiru contributors" }]
keywords = ["ai", "agents", "mcp", "tool-intelligence", "agent-safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  # Shared schemas, claim store, query engine, lean contracts.
  "ayiru-core>=0.1,<0.2",
  "ayiru-mcp>=0.2.1,<0.3",
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  # Stage 22-stretch — ONNX-backed embedding model for semantic re-rank
  # in ask(). ~130 MB on disk for BAAI/bge-small-en-v1.5. Picked over
  # sentence-transformers because the latter pulls torch (~2 GB install).
  "fastembed>=0.8,<1.0",
  "graphql-core>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "jsonschema>=4.20,<5.0",
  "openapi-spec-validator>=0.7,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  # pytest 8.4.x carries CVE-2025-71176; 8.5+ contains the patch, 9.x is the
  # canonical fix. Allow both so contributors on either line stay green.
  "pytest>=8.5,<10.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
# After `pip install ayiru`, the binary `ayiru` lands on PATH
# and dispatches to `app.cli:main`. The package name stayed `app` to
# avoid a repo-wide rename for v1; we treat it as an internal detail.
ayiru = "app.cli:main"

[project.urls]
Homepage = "https://github.com/ruth411/ayiru"
Repository = "https://github.com/ruth411/ayiru"
Issues = "https://github.com/ruth411/ayiru/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
# `app` and `app.contracts` and `app.services` are PEP 420 namespace
# packages shared with the `ayiru-core` wheel. Both wheels contribute
# disjoint subtrees of `app.*`; `importlib.resources.files("app.contracts")`
# merges contributors via MultiplexedPath at runtime.
namespaces = true

[tool.setuptools.package-data]
# Only the ingestion-side contracts ship in this wheel. The lean
# contracts (risk_model, confidence_model, query_policy, tool_trust_sources,
# ayiru_stage_0.v{1,2}) ship in ayiru-core.
"app.contracts" = ["*.json"]
"app.seed_data" = ["**/*.json", "main.py"]
"app._alembic" = ["*.py", "**/*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
